name: museum-pass-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum is 5 min, and runs can start a few minutes late
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send one test email instead of scanning"
        type: boolean
        default: false

concurrency:
  group: pass-watch
  cancel-in-progress: false

permissions:
  contents: write   # lets the job save state.json so you are not emailed twice

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan passes and email new ones
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python monitor.py ${{ inputs.send_test_email && '--test-email' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "pass-watch"
          git config user.email "pass-watch@users.noreply.github.com"
          [ -f state.json ] || exit 0
          cp state.json "$RUNNER_TEMP/state.json"
          for i in 1 2 3; do
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update state"
            git push && exit 0
            # remote moved on: re-sync to it, then re-apply our state file and retry
            git fetch origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
          done
          exit 1
